<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <canvas id="myCanvas" width="600" height="400" style="border: 3px solid">
    </canvas>
    <script>
      var ctx = document.getElementById("myCanvas");
      var myContext = ctx.getContext("2d");

      myContext.strokeRect(10, 10, 150, 150);
      myContext.fillRect(170, 10, 70, 70);
      myContext.fillRect(10, 200, 100, 100);
      myContext.clearRect(180, 20, 50, 50);
    </script>
  </body>
</html>
